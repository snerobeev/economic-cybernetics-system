spring:
  output:
    ansi:
      enabled: ALWAYS

  application:
    name: economic-cybernetics-system

  datasource:
    url: jdbc:postgresql://localhost:5432/ecodb
    username: user
    password: 1234
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db.migration

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

server:
  port: 8080
  error:
    include-stacktrace: never

logging:
  level:
    dev.nerobeev.economic_cybernetics_system: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE


# Настройки экономических расчетов
economic-cybernetics:
  matrix:
    precision: 6
    max-iterations: 1000
  planning:
    default-quarters: 4
    base-year: 2025