spring:
  output:
    ansi:
      enabled: ALWAYS

profiles:
  active: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000


  h2:
    console:
      enabled: true

  flyway:
    enabled: false

  web:
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

server:
  port: 8080
  error:
    include-stacktrace: never

logging:
  level:
    dev.nerobeev.economic_cybernetics_system: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.test: INFO
    dev.nms: DEBUG

# Настройки экономических расчетов
economic-cybernetics:
  matrix:
    precision: 6
    max-iterations: 1000
  planning:
    default-quarters: 4
    base-year: 2025